<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1200" width="1200" height="1200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <path id="pinShape" d="M0 0 C0 0 -200 -200 -200 -380 A200 200 0 0 1 200 -380 C200 -200 0 0 0 0 Z"/>
    <path id="lobe" d="M598 455 C585 430 545 428 530 452 C505 455 495 485 505 505 C490 520 497 552 520 560 C520 585 548 598 570 588 C580 600 598 595 598 585 Z"/>
    <path id="folds" d="M530 452 C540 472 560 472 566 490 M505 505 C525 507 540 498 550 512 M520 560 C540 552 556 556 566 545 M570 588 C564 572 574 562 586 556"/>
  </defs>

  <!-- Fundo do mapa -->
  <rect width="1200" height="1200" fill="#D9F2E3"/>

  <!-- Parques -->
  <ellipse cx="190" cy="230" rx="230" ry="170" fill="#B7E4C7"/>
  <ellipse cx="1050" cy="1010" rx="260" ry="190" fill="#B7E4C7"/>
  <ellipse cx="1090" cy="170" rx="170" ry="120" fill="#C6EBD2"/>

  <!-- Água -->
  <path d="M-20 900 C150 840 260 980 430 1010 C560 1035 640 1120 700 1230 L-20 1230 Z" fill="#A5D8F3"/>
  <path d="M-20 930 C150 870 260 1010 430 1040 C540 1060 610 1130 660 1230" fill="none" stroke="#C9E9FA" stroke-width="10" opacity="0.8"/>

  <!-- Ruas secundárias -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M0 400 L1200 330"/>
    <path d="M0 700 L1200 760"/>
    <path d="M300 0 L370 1200"/>
    <path d="M880 0 L820 1200"/>
    <path d="M0 140 L520 420"/>
    <path d="M1200 560 L760 700"/>
  </g>
  <!-- Ruas principais -->
  <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M-20 560 C300 520 500 640 700 600 C900 560 1050 600 1220 520"/>
    <path d="M600 -20 C560 300 650 500 600 700 C560 880 620 1050 590 1220"/>
  </g>

  <!-- Quarteirões -->
  <g fill="#EAF7EF" opacity="0.85">
    <rect x="80" y="450" width="120" height="90" rx="14"/>
    <rect x="990" y="610" width="110" height="80" rx="14"/>
    <rect x="410" y="100" width="110" height="90" rx="14"/>
    <rect x="690" y="1000" width="110" height="80" rx="14"/>
    <rect x="140" y="720" width="100" height="80" rx="14"/>
    <rect x="950" y="420" width="120" height="80" rx="14"/>
  </g>

  <!-- Rota pontilhada até os pontos de apoio -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 24" fill="none">
    <path d="M600 905 C470 850 330 640 300 395"/>
    <path d="M600 905 C700 800 860 520 930 400"/>
    <path d="M600 905 C500 960 340 930 250 880"/>
    <path d="M600 905 C720 960 900 900 985 830"/>
  </g>

  <!-- Anéis de radar ao redor do jogador -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6">
    <ellipse cx="600" cy="905" rx="150" ry="46" opacity="0.95"/>
    <ellipse cx="600" cy="905" rx="250" ry="76" opacity="0.6"/>
    <ellipse cx="600" cy="905" rx="360" ry="110" opacity="0.35"/>
  </g>
  <ellipse cx="600" cy="905" rx="150" ry="46" fill="url(#glow)" opacity="0.7"/>
  <ellipse cx="605" cy="912" rx="95" ry="20" fill="#000000" opacity="0.14"/>

  <!-- Pin principal -->
  <g transform="translate(600 900)">
    <use xlink:href="#pinShape" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <circle cx="600" cy="520" r="140" fill="#FFFFFF"/>

  <!-- Cérebro -->
  <g>
    <use xlink:href="#lobe" fill="#FF8FB1"/>
    <use xlink:href="#lobe" fill="#FF8FB1" transform="translate(1200 0) scale(-1 1)"/>
    <g fill="none" stroke="#D9457A" stroke-width="9" stroke-linecap="round">
      <use xlink:href="#folds"/>
      <use xlink:href="#folds" transform="translate(1200 0) scale(-1 1)"/>
      <path d="M600 452 L600 590"/>
    </g>
  </g>

  <!-- Pin: coração (apoio emocional) -->
  <g transform="translate(300 395) scale(0.34)">
    <use xlink:href="#pinShape" fill="#FF7AA8" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round"/>
    <circle cx="0" cy="-380" r="135" fill="#FFFFFF"/>
    <path d="M0 -325 C-95 -395 -75 -485 -32 -468 C-12 -462 0 -445 0 -440 C0 -445 12 -462 32 -468 C75 -485 95 -395 0 -325 Z" fill="#FF7AA8"/>
  </g>

  <!-- Pin: cruz (serviço de saúde) -->
  <g transform="translate(930 400) scale(0.34)">
    <use xlink:href="#pinShape" fill="#34D399" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round"/>
    <circle cx="0" cy="-380" r="135" fill="#FFFFFF"/>
    <rect x="-25" y="-445" width="50" height="130" rx="10" fill="#34D399"/>
    <rect x="-65" y="-405" width="130" height="50" rx="10" fill="#34D399"/>
  </g>

  <!-- Pin: balão de conversa (escuta) -->
  <g transform="translate(250 880) scale(0.34)">
    <use xlink:href="#pinShape" fill="#FBBF24" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round"/>
    <circle cx="0" cy="-380" r="135" fill="#FFFFFF"/>
    <rect x="-75" y="-435" width="150" height="100" rx="30" fill="#FBBF24"/>
    <path d="M-35 -340 L-60 -295 L5 -335 Z" fill="#FBBF24"/>
  </g>

  <!-- Pin: casa / comunidade -->
  <g transform="translate(985 830) scale(0.34)">
    <use xlink:href="#pinShape" fill="#60A5FA" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round"/>
    <circle cx="0" cy="-380" r="135" fill="#FFFFFF"/>
    <path d="M-90 -375 L0 -455 L90 -375 Z" fill="#60A5FA"/>
    <rect x="-60" y="-375" width="120" height="75" rx="8" fill="#60A5FA"/>
  </g>

  <!-- Brilhos -->
  <g fill="#FFFFFF">
    <path d="M820 230 l10 28 l28 10 l-28 10 l-10 28 l-10 -28 l-28 -10 l28 -10 Z"/>
    <path d="M420 300 l7 20 l20 7 l-20 7 l-7 20 l-7 -20 l-20 -7 l20 -7 Z"/>
    <path d="M770 760 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8 l22 -8 Z"/>
  </g>

  <!-- Moldura -->
  <rect x="6" y="6" width="1188" height="1188" fill="none" stroke="#8B5CF6" stroke-width="12" rx="36" opacity="0.9"/>
</svg>
